<!DOCTYPE html>
<html>
<head>
    <title>GIS Data Editor</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #3494e6;
            --secondary: #3494e6;
            --accent: #36d1dc;
            --success: #22c55e;
            --danger: #ef4444;
            --background: #f0f7ff;
            --text: #1e293b;
            --map-bg: #e8f4f8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
            overflow-x: hidden;
            padding: 2rem;
            background: 
                radial-gradient(circle at top right, #b6e3ff, transparent),
                radial-gradient(circle at bottom left, #d4f0ff, var(--background));
        }

        .edit-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 
                0 20px 50px rgba(52, 148, 230, 0.2),
                0 10px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            transform-style: preserve-3d;
            animation: floatIn 1s ease-out;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
        }

        .edit-container::before {
            content: '🗺️';
            position: absolute;
            top: -30px;
            right: -30px;
            font-size: 4rem;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 2rem;
            text-align: center;
            position: relative;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        h1::before { content: '📍'; }
        h1::after { content: '🌍'; }

        .form-group {
            margin-bottom: 1.8rem;
            position: relative;
            transform-style: preserve-3d;
            transition: all 0.4s ease;
        }

        .form-group:hover {
            transform: translateZ(20px) scale(1.02);
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 0.8rem;
            font-weight: 600;
            color: var(--text);
        }

        input, textarea, select {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: var(--map-bg);
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 
                0 0 0 3px rgba(54, 209, 220, 0.2),
                0 10px 20px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
            background: white;
        }

        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #36d1dc, #3494e6);
            color: white;
            box-shadow: 0 4px 15px rgba(54, 209, 220, 0.3);
        }

        .btn-container {
            display: flex;
            gap: 15px;
            margin-top: 2.5rem;
        }

        .compass {
            position: absolute;
            top: -20px;
            left: -20px;
            font-size: 2.5rem;
            animation: spin 10s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .geo-particle {
            position: fixed;
            pointer-events: none;
            animation: geoFloat 2s ease-out forwards;
            font-size: 1.5rem;
        }

        @keyframes geoFloat {
            0% {
                transform: translateY(0) rotate(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .map-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.1;
            background: 
                linear-gradient(45deg, transparent 48%, #3494e6 49%, #3494e6 51%, transparent 52%) 0 0/30px 30px,
                linear-gradient(-45deg, transparent 48%, #3494e6 49%, #3494e6 51%, transparent 52%) 0 0/30px 30px;
        }
    </style>
</head>
<body>
    <div class="map-bg"></div>
    <div class="edit-container">
        <div class="compass">🧭</div>
        <h1>GIS Data Editor</h1>
        <form method="POST" enctype="multipart/form-data" id="editForm">
            {% csrf_token %}
            <div class="form-group">
                <label>Nama Lokasi 📍</label>
                <input type="text" name="nama" value="{{ row.Nama }}" required>
            </div>

            <div class="form-group">
                <label>Kategori 🏷️</label>
                <select name="kategori" required>
                    <option value="Halte" {% if row.Kategori == "Halte" %}selected{% endif %}>🚏 Halte</option>
                    <option value="Bandara" {% if row.Kategori == "Bandara" %}selected{% endif %}>✈️ Bandara</option>
                    <option value="Sekolah" {% if row.Kategori == "Sekolah" %}selected{% endif %}>🏫 Sekolah</option>
                    <option value="Taman" {% if row.Kategori == "Taman" %}selected{% endif %}>🌳 Taman</option>
                    <option value="Rumah Sakit" {% if row.Kategori == "Rumah Sakit" %}selected{% endif %}>🏥 Rumah Sakit</option>
                    <option value="Pasar" {% if row.Kategori == "Pasar" %}selected{% endif %}>🏪 Pasar</option>
                    <option value="Tempat Ibadah" {% if row.Kategori == "Tempat Ibadah" %}selected{% endif %}>🕌 Tempat Ibadah</option>
                    <option value="Universitas" {% if row.Kategori == "Universitas" %}selected{% endif %}>🎓 Universitas</option>
                    <option value="Pusat Perbelanjaan" {% if row.Kategori == "Pusat Perbelanjaan" %}selected{% endif %}>🛍️ Pusat Perbelanjaan</option>
                    <option value="GOR Olahraga" {% if row.Kategori == "GOR Olahraga" %}selected{% endif %}>⚽ GOR Olahraga</option>
                </select>
            </div>

            <div class="form-group">
                <label>Latitude 🌐</label>
                <input type="text" name="latitude" value="{{ row.Latitude }}" required>
            </div>

            <div class="form-group">
                <label>Longitude 🌍</label>
                <input type="text" name="longitude" value="{{ row.Longitude }}" required>
            </div>

            <div class="form-group">
                <label>Deskripsi 📝</label>
                <textarea name="deskripsi" required>{{ row.Deskripsi }}</textarea>
            </div>

            <div class="form-group">
                <label>Gambar Lokasi 🖼️</label>
                <input type="file" name="gambar">
                {% if row.Nama_File_Gambar %}
                <img src="/media/{{ row.Nama_File_Gambar }}" alt="Current image" style="width:200px; margin-top:10px; border-radius:8px;">
                {% endif %}
            </div>

            <div class="btn-container">
                <button type="submit" class="btn btn-primary">Simpan Data 💾</button>
                <a href="/" class="btn btn-secondary">Kembali 🔙</a>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('editForm');
        const geoEmojis = ['📍', '🌍', '🗺️', '🧭', '🌐', '🏔️', '🌋', '🗻', '🏕️', '⛰️'];

        function createGeoParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'geo-particle';
            particle.textContent = geoEmojis[Math.floor(Math.random() * geoEmojis.length)];
            particle.style.left = `${x}px`;
            particle.style.top = `${y}px`;
            document.body.appendChild(particle);
            
            particle.addEventListener('animationend', () => particle.remove());
        }

        document.querySelectorAll('input, textarea, select').forEach(el => {
            el.addEventListener('focus', (e) => {
                const rect = e.target.getBoundingClientRect();
                createGeoParticle(rect.left, rect.top);
            });
        });

        form.addEventListener('submit', (e) => {
            for(let i = 0; i < 10; i++) {
                setTimeout(() => {
                    const x = window.innerWidth / 2 + (Math.random() - 0.5) * 200;
                    const y = window.innerHeight / 2 + (Math.random() - 0.5) * 200;
                    createGeoParticle(x, y);
                }, i * 100);
            }
        });
    </script>
</body>
</html>
